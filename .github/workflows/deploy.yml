name: Build and deploy to GitHub Pages

# Runs every time you push to the main branch, and can also be started by hand
# from the Actions tab on GitHub.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions GitHub Pages needs in order to publish.
permissions:
  contents: read
  pages: write
  id-token: write

# If you push twice quickly, cancel the older run rather than deploying stale files.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: npm run build

      - name: Prepare for GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
